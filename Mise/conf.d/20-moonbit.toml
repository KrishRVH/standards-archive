[env]
# The toolchain finds its own root from the moon executable; the core
# library is a separately pinned archive.
MOON_CORE_OVERRIDE = { value = '{{ tools["http:moonbit-core"].path }}', tools = true }

[tools."http:moonbit"]
version = "0.10.14+7d59c7ec9"
os = ["linux", "macos"]
# The archives carry no executable bits; the official installer sets them.
postinstall = 'chmod +x "$MISE_TOOL_INSTALL_PATH"/bin/* "$MISE_TOOL_INSTALL_PATH"/bin/internal/*'

[tools."http:moonbit".platforms]
linux-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.14%2B7d59c7ec9/moonbit-linux-aarch64.tar.gz", checksum_url = "https://cli.moonbitlang.com/binaries/0.10.14%2B7d59c7ec9/moonbit-linux-aarch64.tar.gz.sha256" }
linux-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.14%2B7d59c7ec9/moonbit-linux-x86_64.tar.gz", checksum_url = "https://cli.moonbitlang.com/binaries/0.10.14%2B7d59c7ec9/moonbit-linux-x86_64.tar.gz.sha256" }
macos-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.14%2B7d59c7ec9/moonbit-darwin-aarch64.tar.gz", checksum_url = "https://cli.moonbitlang.com/binaries/0.10.14%2B7d59c7ec9/moonbit-darwin-aarch64.tar.gz.sha256" }

# MoonBit publishes no core digest; this one was recorded from the release archive.
[tools."http:moonbit-core"]
version = "0.10.14+7d59c7ec9"
url = "https://cli.moonbitlang.com/cores/core-0.10.14%2B7d59c7ec9.tar.gz"
checksum = "sha256:6f18b8fdea18f85e628a75e4a1bd3977c5a5c9c6a836fd8824192b0e6bd91b14"
os = ["linux", "macos"]

[tasks."moonbit:core"]
description = "Bundle the pinned MoonBit core library for the wasm-gc target"
hide = true
run = 'moon -C "$MOON_CORE_OVERRIDE" bundle --warn-list -a --target wasm-gc --quiet'

[tasks."moonbit:fmt"]
description = "Format MoonBit source"
depends = ["moonbit:core"]
run = "moon fmt"

[tasks."moonbit:fmt:check"]
description = "Check MoonBit formatting"
depends = ["moonbit:core"]
run = "moon fmt --check"

[tasks."moonbit:info"]
description = "Regenerate the committed MoonBit package interfaces"
depends = ["moonbit:core"]
run = "moon info"

[tasks."moonbit:info:check"]
description = "Check that committed MoonBit package interfaces are current"
depends = ["moonbit:core"]
run = "scripts/interface.sh"

[tasks."moonbit:lint"]
description = "Check MoonBit source and fail on warnings"
depends = ["moonbit:core"]
run = "moon check --deny-warn"

[tasks."moonbit:test"]
description = "Run MoonBit tests and fail on warnings"
depends = ["moonbit:core"]
run = "moon test --deny-warn"

[tasks."moonbit:standards"]
description = "Run the MoonBit standards workflow with autofixes"
run = [{ task = "moonbit:info" }, { task = "moonbit:fmt" }]

[tasks."moonbit:standards:check"]
description = "Run the MoonBit standards CI gate"
depends = ["moonbit:fmt:check", "moonbit:info:check", "moonbit:lint", "moonbit:test"]
