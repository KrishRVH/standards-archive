[[rule]]
id = "C-TIDY-MEM-001"
concern = "null, bounds, uninitialized, lifetime, ownership, stream, and deallocation defects"
scope = "project translation units and project headers"
profile = "hard analysis"
severity = "hard"
tool = "Clang Static Analyzer through clang-tidy"
exact = ["clang-analyzer-core.BitwiseShift", "clang-analyzer-core.BitwiseShift:Pedantic=true", "clang-analyzer-core.NullDereference", "clang-analyzer-core.uninitialized.UndefReturn", "clang-analyzer-unix.Malloc", "clang-analyzer-unix.Stream", "clang-analyzer-unix.Stream:Pedantic=false", "analyzer dependency closure recorded in hard-checks.txt"]
rationale = "Only five top-level analyzer checks with seeded path defects are selected. BitwiseShift's pedantic mode diagnoses ISO undefined shifts even when a compiler commonly defines them. Stream's non-pedantic mode intentionally avoids demanding handling at every commonly unchecked stream call; the return-value policy and ownership-boundary tests own those contextual decisions. Analyzer-engine dependencies remain in the committed 25-check resolution but are not independent claims."
repair = "Repair the reachable path, ownership transition, bound, initialization, or cleanup boundary."
exception = "A path proven impossible by a higher-ranked contract may use one check-named suppression with that invariant."
fixture = "standards-tests/analyzer/fixtures/{double-free,use-after-free,leak-on-path,null-dereference,uninitialized-read,invalid-shift,mismatched-cleanup,header source with spaces}.c"
version = "clang-tidy 22.1.8; exact resolution in hard-checks.txt"

