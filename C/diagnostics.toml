profile = "clang-package"
severity = "hard"
tool = "ELF linker through CMake"
exact = ["LINKER:-z,defs"]
rationale = "A package library that retains unresolved nonruntime symbols defers a deterministic build defect to its consumer."
repair = "Link the owning dependency or correct the missing/hidden definition."
exception = "A plugin ABI that intentionally resolves host symbols needs a separate target contract; it must not weaken ordinary libraries."
