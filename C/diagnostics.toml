profile = "Clang and GCC"
severity = "hard"
tool = "compiler"
exact = ["-Wshadow", "-Wimplicit-fallthrough", "-Wswitch-enum"]
rationale = "These protect local invariants and make control transfer explicit without banning disciplined cleanup paths."
repair = "Rename the binding, annotate deliberate fallthrough, or handle the enumerator explicitly."
exception = "A switch default is not required when explicit enumerator handling provides stronger evolution diagnostics."
fixture = "standards-tests/compiler/warning-cases.tsv and warning-fixtures.c"
version = "Clang 22.1.8; GCC 15.2.0"

[[rule]]
id = "C-COMP-PORT-001"
concern = "extension, preprocessor, stack, and reproducibility hazards"
scope = "project targets"
profile = "Clang and GCC"
severity = "hard"
tool = "compiler"
exact = ["-Wall", "-Wextra", "-Wpedantic", "-Wundef", "-Wvla", "-Walloca", "-Wdate-time", "-fno-common"]
rationale = "The set rejects undeclared dialect features, unbounded automatic allocation, unstable timestamps, and tentative-definition linkage accidents."
repair = "Use declared features, bounded owned storage, explicit preprocessor tests, and one definition."
exception = "No VLA/alloca exception in the default profile; generated code belongs in a separate target."
fixture = "standards-tests/compiler/warning-cases.tsv, warning-fixtures.c, and common-definition-*.c"
version = "Clang 22.1.8; GCC 15.2.0"

[[rule]]
id = "C-COMP-CLANG-001"
