[[rule]]
id = "C-COMP-FORMAT-001"
concern = "variadic format type mismatch and format injection"
scope = "project targets"
profile = "Clang and GCC"
severity = "hard"
tool = "compiler"
exact = ["-Wformat=2", "-Wformat-security"]
rationale = "Mismatched variadic arguments can be undefined behavior; nonliteral formats prevent the compiler from proving the argument contract and stay hard by default."
repair = "Match every conversion to the promoted argument type, use a literal format boundary, or give a real variadic wrapper a supported compiler format attribute."
exception = "A reviewed wrapper may use the narrowest compiler-specific attribute or local suppression with an API invariant; no global disable permits an unchecked nonliteral format."
fixture = "standards-tests/compiler/format-wrapper.c and warning-fixtures.c"
version = "Clang 22.1.8; GCC 15.2.0"

[[rule]]
id = "C-COMP-CONTROL-001"
concern = "shadowing, fallthrough, incomplete switches, and suspicious control flow"
