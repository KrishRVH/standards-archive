[severity]
hard = "The invoked gate fails on a demonstrated correctness, safety, build-contract, supported-portability, or deterministic-presentation violation."
ratcheted-advisory = "A context-sensitive finding is reviewed and may not increase beyond the explicit baseline; it is never an autonomous rewrite order."
informational = "Useful interactive or periodic evidence that cannot fail a mandatory gate or justify an autonomous source change."
disabled-with-rationale = "Not enabled because the rule is noisy, duplicated, inapplicable, unstable, or lacks a defensible repair and fixture."

# Each entry is one reviewable policy category. `exact` is exhaustive for that
# category; no wildcard expands into an unreviewed hard rule.

[[rule]]
id = "C-LANG-001"
concern = "ISO C99 syntax and extension leakage"
scope = "every project target"
profile = "all hosted profiles"
severity = "hard"
tool = "CMake target properties and compiler"
exact = ["C_STANDARD=99", "C_STANDARD_REQUIRED=YES", "C_EXTENSIONS=NO", "c_std_99"]
rationale = "The declared language contract is strict C99, never an inferred GNU dialect."
repair = "Remove the extension or introduce a separately justified profile; do not switch to gnu99."
exception = "No local exception; a new language profile needs an explicit contract and tests."
fixture = "standards-tests/fixtures/compile/gnu-extension.c"
version = "CMake 4.4.0; Clang 22.1.8; GCC 15.2.0"

[[rule]]
id = "C-PLATFORM-001"
concern = "undeclared platform API and feature exposure"
scope = "translation units using operating-system APIs"
profile = "iso-hosted, posix-2008, win32"
severity = "hard"
tool = "CMake profile definitions and compile fixtures"
exact = ["PROJECT_PLATFORM_PROFILE", "_POSIX_C_SOURCE=200809L", "_FILE_OFFSET_BITS=64", "_WIN32_WINNT=0x0A00", "WINVER=0x0A00"]
rationale = "A language dialect does not declare POSIX, Win32, libc, or large-file ABI contracts."
repair = "Select the target-scoped platform profile or replace the platform API with ISO C99."
exception = "Public ABI-visible platform types require an explicit consumer contract, not a local suppression."
fixture = "standards-tests/platform/posix-contract.c; standards-tests/run.sh"
version = "POSIX.1-2008 namespace; glibc-specific large-file macro"

[[rule]]
id = "C-ARITH-001"
concern = "signed overflow and public arithmetic contracts"
scope = "public APIs, allocation sizes, indexes, counters, and shifts"
profile = "all"
severity = "hard"
tool = "behavior tests, compiler diagnostics, clang-tidy, and UBSan"
exact = ["check before signed arithmetic", "checked project_add API", "clang-analyzer-core.BitwiseShift", "-fsanitize=undefined"]
rationale = "Representable public inputs must not reach undefined signed overflow or invalid shifts; checked outputs make failure explicit."
repair = "Prove bounds before evaluation, preserve outputs on failure, and test both representable limits."
exception = "A documented precondition is permitted only when every caller is inside the same enforceable contract; untrusted/public inputs use a checked result."
fixture = "tests/project_tests.c; standards-tests/fixtures/runtime/allocation-size.c; analyzer/fixtures/invalid-shift.c; sanitizer/signed-overflow.c"
version = "ISO C99 arithmetic contract; Clang/UBSan 22.1.8"

[[rule]]
id = "C-COMP-DECL-001"
concern = "declaration, prototype, and type-constraint correctness"
scope = "project targets; private warning policy"
profile = "Clang and GCC"
severity = "hard"
tool = "compiler"
exact = ["-Wstrict-prototypes", "-Wmissing-prototypes", "-Wdeprecated-non-prototype (Clang)", "-Wold-style-definition (GCC)", "-Werror=implicit-function-declaration", "-Werror=incompatible-pointer-types", "-Werror=int-conversion"]
rationale = "These diagnose C99 constraints, accidental old-style interfaces, and incompatible calls with direct repairs."
repair = "Declare the exact interface and correct the represented type mismatch."
exception = "Generated or foreign declarations must be isolated in a target not governed by the private policy."
fixture = "standards-tests/compiler/warning-cases.tsv and warning-fixtures.c"
version = "Clang 22.1.8; GCC 15.2.0"

[[rule]]
id = "C-COMP-CONV-001"
concern = "lossy, sign-changing, qualifier, and pointer conversions"
scope = "project targets; private warning policy"
profile = "Clang and GCC"
severity = "hard"
tool = "compiler"
exact = ["-Wconversion", "-Wsign-conversion", "-Wcast-qual", "-Wpointer-arith"]
rationale = "Implicit representation changes and discarded qualifiers commonly invalidate size, bounds, and ownership reasoning."
repair = "Prove the range or redesign the types; use a cast only when it records that proof rather than hiding it."
exception = "A narrow cast may be documented beside a checked range or API invariant."
fixture = "standards-tests/compiler/warning-cases.tsv and warning-fixtures.c"
