mirror = [
  ".oxfmtrc.json",
  ".oxlintrc.json",
  "README.md",
  "bunfig.toml",
  "jsconfig.json",
  "knip.jsonc",
  "package.json",
  "src/math.js",
  "tests/math.test.js",
  "tests/tooling-contract.test.js",
]
shared_mirror = [".gitignore"]
required_tester_files = ["bun.lock"]

