mirror = [
  ".editorconfig",
  ".gdlintrc",
  "project.godot",
  "src/counter.gd",
  "src/counter.gd.uid",
  "tests/gdscript_load_check.gd",
  "tests/gdscript_load_check.gd.uid",
  "tests/run_tests.gd",
  "tests/run_tests.gd.uid",
]

[profiles.haskell]
name = "Haskell"
template = "Haskell"
tester = "testers/haskell"
task_prefix = "haskell"
task_fragment = "20-haskell.toml"
mirror = [
  ".hlint.yaml",
  "app/Main.hs",
  "bench/Main.hs",
  "cabal.project",
  "project-name.cabal",
