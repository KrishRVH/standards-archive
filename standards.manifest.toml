[profiles.c]
name = "C"
template = "C"
tester = "testers/c"
task_prefix = "c"
task_fragment = "20-c.toml"
mirror = [
  ".clang-format",
  ".clang-tidy",
  ".clang-tidy-advisory",
  ".clang-tidy-advisory-baseline",
  "CMakeLists.txt",
  "CMakePresets.json",
  "c-build.sh",
  "c-format.sh",
  "c-quality.sh",
  "cmake/ProjectCStandards.cmake",
  "cmake/project-name-config.cmake.in",
  "diagnostics.toml",
  "include/project/library.h",
  "mingw-w64.cmake",
  "src/library.c",
  "src/main.c",
  "standards-tests/analyzer/CMakeLists.txt",
  "standards-tests/analyzer/duplicate-cdb/CMakeLists.txt",
  "standards-tests/analyzer/fixtures/cohesive-diagnostic.c",
  "standards-tests/analyzer/fixtures/double-free.c",
  "standards-tests/analyzer/fixtures/fragmented-diagnostic.c",
  "standards-tests/analyzer/fixtures/header source with spaces.c",
  "standards-tests/analyzer/fixtures/invalid-shift.c",
  "standards-tests/analyzer/fixtures/leak-on-path.c",
  "standards-tests/analyzer/fixtures/mismatched-cleanup.c",
  "standards-tests/analyzer/fixtures/missing-braces.c",
  "standards-tests/analyzer/fixtures/null-dereference.c",
  "standards-tests/analyzer/fixtures/uninitialized-read.c",
  "standards-tests/analyzer/fixtures/use-after-free.c",
  "standards-tests/analyzer/hard-checks.txt",
  "standards-tests/analyzer/include with spaces/project defect.h",
  "standards-tests/cmake/excluded-directory/CMakeLists.txt",
  "standards-tests/cmake/interface-target/CMakeLists.txt",
  "standards-tests/cmake/no-tests/CMakeLists.txt",
  "standards-tests/cmake/no-tests/main.c",
  "standards-tests/cmake/stripped-target/CMakeLists.txt",
  "standards-tests/cmake/unregistered-target/CMakeLists.txt",
  "standards-tests/cmake/unregistered-target/main.c",
  "standards-tests/cmake/unregistered-target/nested/CMakeLists.txt",
  "standards-tests/cmake/unsupported-compiler.cmake",
  "standards-tests/compiler/clang-flags.txt",
  "standards-tests/compiler/common-definition-a.c",
  "standards-tests/compiler/common-definition-b.c",
  "standards-tests/compiler/common-flags.txt",
  "standards-tests/compiler/format-wrapper.c",
  "standards-tests/compiler/gcc-debug-flags.txt",
  "standards-tests/compiler/gcc-release-flags.txt",
  "standards-tests/compiler/warning-cases.tsv",
  "standards-tests/compiler/warning-fixtures.c",
  "standards-tests/compiler/warning-resolution.txt",
  "standards-tests/consumer/CMakeLists.txt",
  "standards-tests/consumer/main.c",
  "standards-tests/fixtures/compile/clang-comma.c",
  "standards-tests/fixtures/compile/format-mismatch.c",
  "standards-tests/fixtures/compile/gcc-duplicated-condition.c",
  "standards-tests/fixtures/compile/gnu-extension.c",
  "standards-tests/fixtures/compile/sign-conversion.c",
  "standards-tests/fixtures/compile/vla.c",
  "standards-tests/fixtures/runtime/allocation-size.c",
  "standards-tests/fixtures/runtime/argument-contract.c",
  "standards-tests/fixtures/runtime/ownership-cleanup.c",
  "standards-tests/fixtures/runtime/short-read.c",
  "standards-tests/fixtures/sanitizer/heap-buffer-overflow.c",
  "standards-tests/fixtures/sanitizer/signed-overflow.c",
  "standards-tests/format/representative.c.expected",
  "standards-tests/format/representative.c.in",
  "standards-tests/platform/posix-contract.c",
  "standards-tests/platform/win32-api.c",
  "standards-tests/run.sh",
  "tests/project_tests.c",
]
dagger = true

[profiles.cpp]
name = "C++"
template = "C++"
tester = "testers/cpp"
task_prefix = "cpp"
task_fragment = "20-cpp.toml"
mirror = [
  ".clang-format",
  ".clang-tidy",
  "CMakeLists.txt",
  "CMakePresets.json",
  "cmake/project-name-config.cmake.in",
  "cpp-build.sh",
  "cpp-format.sh",
  "cpp-quality.sh",
  "include/project/library.h",
  "mingw-w64.cmake",
  "msvc-xwin.cmake",
  "src/library.cpp",
  "src/main.cpp",
  "tests/project_tests.cpp",
]
fixture_checks = ["cpp:msvc"]

[profiles.elixir]
name = "Elixir"
template = "Elixir"
tester = "testers/elixir"
task_prefix = "elixir"
task_fragment = "20-elixir.toml"
mirror = [".credo.exs", ".formatter.exs", "mix.exs"]

[profiles.fortran]
name = "Fortran"
template = "Fortran"
tester = "testers/fortran"
task_prefix = "fortran"
task_fragment = "20-fortran.toml"
mirror = [
  ".fortls",
  "app/main.f90",
  "ford.md",
  "fpm.toml",
  "scripts/check-fpm-manifest.py",
  "scripts/format.sh",
  "src/project_name.f90",
  "test/main.f90",
  "test/test_project_name.f90",
]

[profiles.gdscript]
name = "GDScript"
