[env]
# Lake builds every output from pinned source: no downloaded build caches, no
# shared artifact cache, and no cache directory under the home directory.
LAKE_NO_CACHE = "true"
LAKE_ARTIFACT_CACHE = "false"
LAKE_CACHE_DIR = ""
# A Lean panic prints a message and continues with a default value; make every
# panic in the build, the audit, the tests, and the exporter fatal instead.
LEAN_ABORT_ON_PANIC = "1"

[tools."http:lean"]
version = "4.34.1"
url = 'https://github.com/leanprover/lean4/releases/download/v{{ version }}/lean-{{ version }}-{{ os(macos="darwin") }}{{ arch(x64="", arm64="_aarch64") }}.tar.zst'
checksum_url = "https://api.github.com/repos/leanprover/lean4/releases/tags/v{{ version }}"
checksum_expr = 'filter(fromJSON(body).assets, { #.name == filename })[0].digest'
strip_components = 1
bin_path = "bin"

[tools]
rust = "1.94.0"
"cargo:https://github.com/ammkrn/nanoda_lib" = "rev:3a2407216ee84a75f9e1aead6803d0578be06ae7"

[tasks."lean:build"]
description = "Check Lean source rules, then build every target with warnings as errors"
run = "scripts/check.sh build"

[tasks."lean:fmt"]
description = "Check Lean text rules; Lean has no formatter to apply"
depends = ["lean:build"]
run = "lake exe project_name_audit format"

[tasks."lean:fmt:check"]
description = "Check Lean text rules"
depends = ["lean:build"]
run = "lake exe project_name_audit format"

# The checks below share Lake's build directory, so they run in turn.
[tasks."lean:lint"]
description = "Run the Lean audit: pins, axioms, contracts, docs, linters, IR"
depends = ["lean:build"]
wait_for = ["lean:fmt:check"]
run = ["lake lint", "scripts/check.sh shake"]

[tasks."lean:test"]
description = "Run kernel examples, runtime examples, and seeded property tests"
depends = ["lean:build"]
wait_for = ["lean:lint"]
run = "lake test"

[tasks."lean:kernel"]
description = "Recheck every declaration with leanchecker, lean4lean, and nanoda"
depends = ["lean:build"]
wait_for = ["lean:test"]
run = ["scripts/check.sh kernel", "scripts/check.sh nanoda"]

[tasks."lean:reproduce"]
description = "Rebuild offline in a fresh directory and require identical outputs"
depends = ["lean:build"]
wait_for = ["lean:kernel"]
run = "scripts/check.sh reproduce"

[tasks."lean:standards"]
description = "Run the Lean standards workflow; there are no autofixes"
depends = ["lean:fmt"]

[tasks."lean:standards:check"]
description = "Run the Lean standards CI gate"
depends = ["lean:fmt:check", "lean:lint", "lean:test", "lean:kernel", "lean:reproduce"]
