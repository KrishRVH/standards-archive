name = "project_name"
version = "0.1.0"
defaultTargets = ["ProjectName", "project_name"]
testDriver = "project_name_tests"
lintDriver = "project_name_audit"

# Applies to every owned module. Dependencies keep their own options.
[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true
linter.all = true
linter.missingDocs = true

# Every dependency is pinned to a full commit; the audit rejects anything else.
# Batteries supplies the environment linters, Plausible the property tests,
# lean4export the export nanoda reads, and lean4lean a third kernel. lean4lean
# pins an older Batteries; the root's Batteries pin overrides it.
[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "f2effa3d803fda822b1f97b806c47cf2adfbcbc2"

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "118aa17ee84656b8bd727fef7c458ee8c833385c"

[[require]]
name = "lean4export"
git = "https://github.com/leanprover/lean4export"
rev = "076e8e57707e813375e8f9da8bf989799ace9680"

[[require]]
name = "lean4lean"
git = "https://github.com/digama0/lean4lean"
rev = "8223d223ed98661882e95d9d6a7126df7097cd76"

[[lean_lib]]
name = "ProjectName"

[[lean_exe]]
name = "project_name"
root = "ProjectNameMain"

[[lean_exe]]
name = "project_name_tests"
root = "ProjectNameTests"

[[lean_lib]]
name = "ProjectNameAudit"

[[lean_exe]]
name = "project_name_audit"
root = "ProjectNameAudit"
supportInterpreter = true
