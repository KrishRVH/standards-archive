[env]
# mise's asdf:php backend compiles PHP and adds these configure flags;
# Composer needs OpenSSL for HTTPS downloads.
PHP_CONFIGURE_OPTIONS = "--with-openssl --with-readline --with-gettext"

[tools]
# Listed before php so this pinned Composer precedes any copy a PHP build bundles.
"github:composer/composer" = { version = "2.10.3", asset_pattern = "composer.phar", rename_exe = "composer" }
php = "8.5.9"

[tasks."php:install"]
description = "Install PHP dependencies"
run = "composer install --no-interaction"

[tasks."php:lock"]
description = "Refresh the PHP Composer lockfile"
run = "composer update --no-interaction --no-install"

[tasks."php:fmt"]
description = "Auto-fix PHP style issues"
depends = ["php:install"]
run = "composer phpcbf"

[tasks."php:fmt:check"]
description = "Check PHP formatting/style"
depends = ["php:install"]
run = "composer phpcs"

[tasks."php:lint"]
description = "Run PHP lint/static-analysis checks"
depends = ["php:install"]
run = "composer lint"

[tasks."php:test"]
description = "Run PHP tests"
depends = ["php:install"]
run = "composer test"

[tasks."php:standards"]
description = "Run the PHP standards workflow with autofixes"
depends = ["php:install"]
run = "composer standards"

[tasks."php:standards:check"]
description = "Run the PHP standards CI gate"
depends = ["php:install"]
run = "composer standards:check"
